#admin button{font:inherit;font-size:11px;background:#9a8a9a;color:#fff;border:2px solid;border-color:#e6dbe6 #6e5f6e #6e5f6e #e6dbe6;padding:3px 7px;cursor:pointer;text-shadow:1px 1px 0 #000}
#admin button:active{border-color:#6e5f6e #e6dbe6 #e6dbe6 #6e5f6e}#admin .go{background:#2e9a46}#admin .hot{background:#c43a3a}

<script>
const $=id=>document.getElementById(id);
const fmt=n=>{const a=Math.abs(n),s=n<0?'-':'';if(a<1e4)return s+'$'+a.toLocaleString(undefined,{maximumFractionDigits:2});
 const u=['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];let i=-1,v=a;while(v>=1000&&i<10){v/=1000;i++}return s+'$'+v.toFixed(v<10?2:v<100?1:0)+u[i]};
const num=n=>{const a=Math.abs(n);if(a<1e4)return Math.floor(n).toLocaleString();const u=['K','M','B','T'];let i=-1,v=a;while(v>=1000&&i<3){v/=1000;i++}return v.toFixed(1)+u[i]};
const STOCKS=[
 {s:'$F',n:'Ford',base:11,vol:.010,lv:1},{s:'$T',n:'AT&T',base:25,vol:.008,lv:2},{s:'$KO',n:'Coca-Cola',base:68,vol:.007,lv:4},
 {s:'$DIS',n:'Disney',base:105,vol:.011,lv:6},{s:'$AAPL',n:'Apple',base:230,vol:.012,lv:8},{s:'$MSFT',n:'Microsoft',base:450,vol:.011,lv:10},
 {s:'$AMZN',n:'Amazon',base:210,vol:.013,lv:12},{s:'$GOOGL',n:'Alphabet',base:185,vol:.012,lv:14},{s:'$NVDA',n:'NVIDIA',base:140,vol:.02,lv:16},
 {s:'$TSLA',n:'Tesla',base:300,vol:.025,lv:18},{s:'$META',n:'Meta',base:620,vol:.015,lv:20},{s:'$BRK.B',n:'Berkshire',base:480,vol:.007,lv:22},
 ...[['$NOK','Nokia',5,.012,1],['$SOFI','SoFi',15,.02,2],['$PFE','Pfizer',26,.008,3],['$INTC','Intel',22,.014,3],['$CSCO','Cisco',60,.008,4],
 ['$VZ','Verizon',42,.007,5],['$BAC','BofA',45,.01,5],['$WMT','Walmart',95,.008,6],['$PEP','PepsiCo',150,.007,7],['$NKE','Nike',75,.012,7],
 ['$SBUX','Starbucks',90,.011,8],['$MCD','McDonalds',300,.007,9],['$AMD','AMD',150,.02,9],['$NFLX','Netflix',1000,.014,11],['$PYPL','PayPal',70,.014,11],
 ['$JNJ','J&J',160,.007,11],['$XOM','Exxon',115,.009,12],['$HD','Home Depot',380,.009,13],['$PG','P&G',165,.006,13],['$JPM','JPMorgan',250,.009,14],
 ['$V','Visa',330,.008,15],['$MA','Mastercard',540,.008,15],['$BA','Boeing',180,.014,16],['$CVX','Chevron',155,.008,16],['$UBER','Uber',80,.016,17],
 ['$COST','Costco',950,.009,17],['$LLY','Eli Lilly',800,.014,18],['$ORCL','Oracle',180,.014,19],['$CRM','Salesforce',300,.013,19],['$ADBE','Adobe',450,.013,20],
 ['$AVGO','Broadcom',200,.016,21],['$PLTR','Palantir',150,.03,21],['$COIN','Coinbase',250,.03,22],['$GS','Goldman',600,.011,23],['$UNH','UnitedHealth',520,.012,23],
 ['$SHOP','Shopify',110,.022,24],['$ASML','ASML',800,.015,25],['$TSM','TSMC',220,.015,26],['$SPOT','Spotify',600,.018,27],['$LMT','Lockheed',480,.008,28],
 ['$SNOW','Snowflake',170,.025,29],['$ABNB','Airbnb',130,.018,30],['$CAT','Caterpillar',380,.011,31],['$ISRG','Intuitive',550,.014,32],
 ['$NOW','ServiceNow',1000,.015,33],['$BKNG','Booking',5000,.012,34],['$MELI','MercadoLibre',2200,.016,36]].map(a=>({s:a[0],n:a[1],base:a[2],vol:a[3],lv:a[4]}))];
(function(){let a=20260611;const r=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 const W1='Apex Nova Blue Iron Solar Quantum Vertex Summit Zenith Crown Falcon Titan Orbit Pioneer Atlas Cobalt Ember Harbor Lumen Nimbus Onyx Prime Raven Sterling Vanguard Willow Yellow Argo Beacon Cedar Delta Echo Frontier Granite Helix Ivory Jade Kestrel Lunar Mosaic'.split(' '),
 W2='Dynamics Systems Holdings Labs Energy Foods Motors Bio Networks Logistics Media Capital Robotics Mining Airlines Pharma Software Steel Retail Telecom Water Chips Gaming Insurance Realty Shipping Apparel Chemicals Aerospace Brewing Cloud Cyber Fusion Genetics Health Industries Materials Power Solutions Studios'.split(' '),
 used=new Set(STOCKS.map(o=>o.s)),nm=new Set(),L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
 for(let i=0;i<1000;i++){let s,n;do{s='$';for(let j=0,k=3+(r()<.5?1:0);j<k;j++)s+=L[r()*26|0]}while(used.has(s));used.add(s);
  do{n=W1[r()*W1.length|0]+' '+W2[r()*W2.length|0]}while(nm.has(n));nm.add(n);
  const b=Math.exp(Math.log(2)+r()*Math.log(1500));STOCKS.push({s,n,base:b<50?+b.toFixed(2):Math.round(b),vol:+(.006+r()*.024).toFixed(4),lv:1+(r()*60|0)})}})();
STOCKS.sort((a,b)=>a.lv-b.lv);
const KEY='screenstocks_v2',HN=140,DIV_T=60;
const fresh=()=>({cash:100,xp:0,lv:1,up:{inc:0,div:0,vol:0,speed:0},ipos:0,t:Date.now(),a1:false,a2:false,sel:0,div:0,
 pos:Object.fromEntries(STOCKS.map(o=>[o.s,{l:0,inv:0,sn:0,sa:0,mg:0,av:10}]))});
let S=fresh(),qi=0,tab=0,tick=0;const QS=[1,10,100,1000,'MAX'];
{let l=null,e=null;try{l=JSON.parse(localStorage.getItem(KEY))}catch(x){}try{e=JSON.parse($('embed').textContent)}catch(x){}
 const d=l&&(!e||(l.t||0)>=(e.t||0))?l:e;if(d){S=Object.assign(fresh(),d);S.pos=Object.assign(fresh().pos,d.pos)}}
STOCKS.forEach(o=>{o.p=o.base*(.9+Math.random()*.2);o.h=[];{let v=o.p;for(let k=0;k<HN;k++){o.h.unshift(v);v/=1+(Math.random()-.5)*2*o.vol+.0004}}o.mk=[];o.open=o.p;o.tr=1});

const income=()=>(1+S.up.inc*2+S.up.inc*S.up.inc*.2)*mult()*(1+S.lv*.08);
const divRate=()=>.01*(1+S.up.div*.7)*mult();
const poolMax=()=>Math.floor(10*Math.pow(1.6,S.up.vol)*(1+S.lv*.15));
const regen=()=>poolMax()/(40/(1+S.up.speed*.5));
const need=l=>Math.floor(60*Math.pow(1.5,l-1));
const cur=()=>STOCKS[S.sel],P=o=>S.pos[o.s];

function xp(n){S.xp+=n;while(S.xp>=need(S.lv)){S.xp-=need(S.lv);S.lv++;msg('LEVEL UP! Level '+S.lv,'gr')}}
function netWorth(){let n=S.cash;STOCKS.forEach(o=>{const p=P(o);n+=p.l*o.p+p.mg+p.sn*(p.sa-o.p)});return n}
const qty=o=>QS[qi]==='MAX'?1e12:QS[qi];
function doBuy(){const o=cur(),p=P(o);if(p.sn>0)return doCover();
 const q=Math.floor(Math.min(qty(o),p.av,S.cash/o.p));if(q<1)return msg('NOT ENOUGH CASH / SHARES','neg');
 S.cash-=q*o.p;p.av-=q;p.inv+=q*o.p;p.l+=q;msg('BOUGHT '+num(q)+' '+o.s,'gr');draw()}
function doSell(){const o=cur(),p=P(o),q=Math.min(qty(o),p.l);if(q<1)return;const f=q/p.l,cost=p.inv*f,g=q*o.p-cost;
 S.cash+=q*o.p;p.l-=q;p.inv-=cost;if(g>0)xp(Math.ceil(Math.log10(g+10)*3));msg('SOLD '+num(q)+' '+o.s+' '+(g>=0?'+':'')+fmt(g),g>=0?'gr':'neg');draw()}
function doShort(){const o=cur(),p=P(o);if(p.l>0)return msg('SELL YOUR LONGS FIRST','neg');
 const q=Math.floor(Math.min(qty(o),p.av,S.cash/(o.p*.5)));if(q<1)return msg('NOT ENOUGH MARGIN / SHARES','neg');
 p.sa=(p.sa*p.sn+o.p*q)/(p.sn+q);p.sn+=q;p.av-=q;S.cash-=q*o.p*.5;p.mg+=q*o.p*.5;msg('SHORTED '+num(q)+' '+o.s,'gr');draw()}
function doCover(){const o=cur(),p=P(o),q=Math.min(qty(o),p.sn);if(q<1)return;const g=(p.sa-o.p)*q,m=p.mg*q/p.sn;
 S.cash+=Math.max(0,m+g);p.mg-=m;p.sn-=q;if(!p.sn){p.sa=0;p.mg=0}if(g>0)xp(Math.ceil(Math.log10(g+10)*3));msg('COVERED '+num(q)+' '+o.s+' '+(g>=0?'+':'')+fmt(g),g>=0?'gr':'neg');draw()}

 if(k>='1'&&k<='8'){tab=+k-1;sfx('tick');build(true);return}if(tab!==0)return;
 if(k==='b'||k==='c')$('b1').click();else if(k==='s')$('b2').click();else if(k==='h')$('b3').click();
 else if(k==='q')$('qb').click();else if(k==='arrowleft')$('pv').click();else if(k==='arrowright')$('nx').click()});
function applySave(d,sv){S=Object.assign(fresh(),d);S.pos=Object.assign(fresh().pos,d.pos||{});S.skin=S.skin||'classic';S.ach=S.ach||{};S.stats=Object.assign({trades:0,shorts:0,best:0,tips:0,t:0},S.stats);
 if(!STOCKS[S.sel]||STOCKS[S.sel].lv>S.lv)S.sel=0;dc=S.cash;applySkin();lastRk=rankIdx(netWorth());if(sv)save();build()}
addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{applySave(JSON.parse(e.newValue));msg('ADMIN UPDATE APPLIED','gr')}catch(x){}}});
// ----- stock picker -----
function pick(){if($('pk'))return;const d=document.createElement('div');d.id='pk';d.style.cssText='position:absolute;inset:0;z-index:35;background:#000c;padding:10px;display:flex;flex-direction:column;gap:6px';
 d.innerHTML='<div style="display:flex;gap:6px"><input id="pks" placeholder="Search ticker or name" autocomplete="off" style="flex:1;font:inherit;background:#0e0b10;color:#5dff7a;border:2px solid #6e5f6e;padding:6px"><button class="btn" id="pkx">X</button></div><div id="pkl" style="flex:1;overflow-y:auto"></div>';
 $('app').appendChild(d);
 const q=()=>{const t=$('pks').value.trim().toLowerCase();let n=0,h='';for(let i=0;i<STOCKS.length&&n<120;i++){const o=STOCKS[i];if(o.lv>S.lv)continue;if(t&&!o.s.toLowerCase().includes(t)&&!o.n.toLowerCase().includes(t))continue;n++;
  h+=`<div class="card s bev t" data-i="${i}" style="cursor:pointer"><span>${o.s} <small>${o.n}</small></span><span class="${o.p>=o.open?'pos':'neg'}">${fmt(o.p)}</span></div>`}
  $('pkl').innerHTML=h||'<div class="card bev t">No match</div>'};
 q();$('pks').oninput=q;$('pks').focus();$('pkx').onclick=()=>d.remove();
 $('pkl').onclick=e=>{const c=e.target.closest('[data-i]');if(c){S.sel=+c.dataset.i;d.remove();switchFx(1);draw()}}}
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))e.stopImmediatePropagation();else if(e.key==='Escape'&&$('pk'))$('pk').remove()},true);
// ----- rank badge + rank-up animation -----
let shownRk=-1;
function rkBadge(){const rk=rankIdx(netWorth());if(rk!==shownRk){shownRk=rk;$('rkb').innerHTML=ri(rk,26);$('rkb').title=RANKS[rk][1]}}
function rankFx(rk,prev){sfx('rank');const tier=(rk/5|0)>(prev/5|0),c=RC[rk/5|0][0],o=mk('','left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(#000a,#000e);z-index:29;overflow:hidden');
 o.innerHTML=`<div class="rays" style="--c:${c}"></div><div class="t" style="font-size:${tier?40:30}px;color:${c};z-index:2">${tier?'NEW TIER!':'RANK UP!'}</div><div style="position:relative;width:170px;height:200px;z-index:2"><div id="rko" style="position:absolute;inset:0;display:flex;justify-content:center">${prev===rk?'':ri(prev,200)}</div><div id="rkn" style="position:absolute;inset:0;display:flex;justify-content:center;filter:drop-shadow(0 0 16px ${c})">${ri(rk,200)}</div></div><div class="t" id="rkt" style="font-size:26px;color:#fff;z-index:2">${RANKS[rk][1]}</div>`;
 o.animate([{opacity:0},{opacity:1}],{duration:200,fill:'both'});
 const d=prev===rk?0:900;
 $('rko').animate([{transform:'scale(1)'},{transform:'scale(1.12)',offset:.45},{transform:'scale(0) rotate(-50deg)',opacity:0}],{duration:700,delay:300,easing:'ease-in',fill:'both'});
 $('rkn').animate([{transform:'scale(0) rotate(200deg)',opacity:0},{transform:'scale(1.4) rotate(-8deg)',opacity:1,offset:.6},{transform:'scale(1) rotate(0)',opacity:1}],{duration:750,delay:d,easing:'ease-out',fill:'both'});
 $('rkt').animate([{transform:'translateY(30px) scale(.4)',opacity:0},{transform:'none',opacity:1}],{duration:500,delay:d+450,easing:'cubic-bezier(.2,1.6,.4,1)',fill:'both'});
 setTimeout(()=>{confetti(tier?90:40);burst($('rkn'),[c,'#fff','#ffd21f'],tier?34:20);shake();$('lv').animate([{filter:'brightness(2)'},{filter:'none'}],{duration:700})},d+520);
 setTimeout(()=>o.animate([{opacity:1},{opacity:0}],{duration:450,fill:'both'}).onfinish=()=>o.remove(),d+2900)}

// ----- admin panel -----
const AF=[['cash','Cash'],['lv','Level'],['xp','XP'],['ipos','IPOs'],['up.inc','Income Up'],['up.div','Dividend Up'],['up.vol','Volume Up'],['up.speed','Refill Up']];
const gp=k=>k.split('.').reduce((o,x)=>o[x],S),sp=(k,v)=>{const a=k.split('.');a.length>1?S[a[0]][a[1]]=v:S[k]=v};
const aN=id=>{const e=$(id),v=Number(e.value);return e.value!==''&&isFinite(v)?v:null};
const fA=n=>Math.abs(n)<1e6?String(Math.floor(n)):n.toExponential(2);
function ref(){S.lv=Math.max(1,Math.floor(S.lv));if(S.xp>=need(S.lv))S.xp=0;if(!STOCKS[S.sel]||STOCKS[S.sel].lv>S.lv)S.sel=0;S.cash=Math.max(0,S.cash);draw();build();aRender();save()}
function setF(k,add){const v=aN('a_'+k);if(v==null)return;const old=gp(k);sp(k,add?old+v:v);$('a_'+k).value='';if(k==='lv'&&gp(k)>old)levelFx();ref()}
function god(){S.cash=1e15;S.lv=Math.max(S.lv,STOCKS[STOCKS.length-1].lv);S.ipos=Math.max(S.ipos,2);Object.keys(S.up).forEach(k=>S.up[k]=20);ACH.forEach(a=>S.ach[a[0]]=1);refill()}
function refill(){STOCKS.forEach(o=>P(o).av=1e15);ref()}
function aGive(i,q){const o=STOCKS[i],p=P(o);p.l+=q;p.inv+=q*o.p}
function give(all){const q=aN('a_q');if(q==null||q<=0)return;if(all)STOCKS.forEach((o,i)=>aGive(i,q));else aGive(+$('a_st').value,q);ref()}
function clearPos(){STOCKS.forEach(o=>Object.assign(P(o),{l:0,inv:0,sn:0,sa:0,mg:0}));ref()}
function jump(){const t=RANKS[+$('a_rk').value][0];S.cash=Math.max(0,S.cash+t*1.001+1-netWorth());ref()}
function rkPrev(){const i=+$('a_rk').value;rankFx(i,Math.max(0,i-1))}
function aMove(m){const o=cur();o.p*=m;o.h[o.h.length-1]=o.p;draw()}
function aCrash(){const o=cur();o.p*=.82;o.mk.push(HN-1);sfx('crash');shake();$('flash').style.opacity=.25;setTimeout(()=>$('flash').style.opacity=0,200);msg('MARKET CRASH! '+o.s+' dips','neg')}
function warp(n){for(let i=0;i<n*2;i++){step();if(i%2)second()}}
function wipe(){if(!confirm('Erase all progress?'))return;noSave=true;try{localStorage.setItem(KEY,JSON.stringify({t:Date.now()}))}catch(e){}location.reload()}
function snapHtml(){save();const c=document.documentElement.cloneNode(true);c.querySelectorAll('.fx,.gold,.toast,#pk').forEach(e=>e.remove());c.querySelector('#embed').textContent=JSON.stringify(S).replace(/</g,'\\u003c');return '<!DOCTYPE html>\n'+c.outerHTML}
async function saveHtml(){const h=snapHtml();try{if(window.showSaveFilePicker){fh=fh||await showSaveFilePicker({suggestedName:'screen-stocks.html',types:[{description:'HTML',accept:{'text/html':['.html']}}]});const w=await fh.createWritable();await w.write(h);await w.close();msg('SAVED INTO HTML FILE','gr');return}}catch(e){if(e.name==='AbortError')return;fh=null}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='screen-stocks.html';a.click();msg('HTML DOWNLOADED (with your save inside)','gr')}
let fh=null;
function copyCode(){const t=JSON.stringify(S);navigator.clipboard?navigator.clipboard.writeText(t):0;$('a_code').value=t;msg('SAVE CODE COPIED','gr')}
function impCode(){try{applySave(JSON.parse($('a_code').value),1);msg('SAVE IMPORTED','gr')}catch(e){msg('BAD SAVE CODE','neg')}}
function aRender(){AF.forEach(f=>{const e=$('a_'+f[0]);if(e&&document.activeElement!==e)e.placeholder=fA(gp(f[0]))});const r=rankIdx(netWorth());$('ainfo').innerHTML='Net worth <span class="gr">'+fmt(netWorth())+'</span><br>Rank <span class="gr">'+RANKS[r][1]+'</span>'}
$('admin').innerHTML=`<div class="r" style="justify-content:space-between"><b style="color:#ffd21f;font-size:14px">ADMIN</b><button onclick="document.body.classList.add('noadm');fit()">HIDE</button></div><div id="ainfo"></div>
<h4>QUICK</h4><div class="r"><button class="go" onclick="god()">GOD MODE</button><button onclick="S.lv=Math.max(S.lv,STOCKS[STOCKS.length-1].lv);ref()">UNLOCK STOCKS</button><button onclick="ACH.forEach(a=>S.ach[a[0]]=1);ref()">ALL ACH</button><button onclick="refill()">REFILL SHARES</button></div>
<h4>NUMBERS (1e9 ok)</h4>${AF.map(f=>`<div class="r"><label>${f[1]}</label><input id="a_${f[0]}"><button onclick="setF('${f[0]}')">SET</button><button class="go" onclick="setF('${f[0]}',1)">ADD</button></div>`).join('')}
<h4>RANKS</h4><div class="r"><select id="a_rk">${RANKS.map((r,i)=>`<option value="${i}">${r[1]} (${fmt(r[0])})</option>`).join('')}</select></div><div class="r"><button class="go" onclick="jump()">JUMP TO RANK</button><button onclick="rkPrev()">PREVIEW ANIM</button></div>
<h4>STOCKS</h4><div class="r"><select id="a_st">${STOCKS.map((o,i)=>`<option value="${i}">${o.s} (L${o.lv})</option>`).join('')}</select><input id="a_q" value="1000"></div><div class="r"><button class="go" onclick="give()">GIVE</button><button class="go" onclick="give(1)">GIVE ALL</button><button class="hot" onclick="clearPos()">CLEAR</button></div>
<div class="r"><button onclick="aMove(1.2)">PUMP 20%</button><button onclick="aMove(.8)">DUMP 20%</button><button class="hot" onclick="aCrash()">CRASH</button></div>
<h4>TEST EFFECTS</h4><div class="r"><button onclick="levelFx()">LEVEL FX</button><button onclick="newsT=1;newsTick()">NEWS</button><button onclick="goldT=1;goldTick()">HOT TIP</button><button onclick="toast('Test Achievement','admin preview')">ACH TOAST</button></div>
<div class="r"><label>Time warp</label><button onclick="warp(30)">30s</button><button onclick="warp(120)">2m</button><button onclick="warp(600)">10m</button></div>
<h4>SAVE</h4><div class="r"><button class="go" onclick="save();msg('GAME SAVED','gr')">SAVE</button><button class="go" onclick="saveHtml()">SAVE TO HTML</button><label style="width:auto"><input type="checkbox" id="afs" style="width:auto"> auto 30s</label></div>
<small>SAVE TO HTML writes your progress into the game file itself (Chrome/Edge: pick the file once, then it overwrites it; other browsers download a copy).</small>
<div class="r"><button onclick="copyCode()">COPY CODE</button><button onclick="impCode()">IMPORT CODE</button><button class="hot" onclick="wipe()">WIPE</button></div><textarea id="a_code" placeholder="save code"></textarea>`;
setInterval(()=>{if(fh&&$('afs').checked)saveHtml()},30000);setInterval(aRender,1000);aRender();
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))e.stopImmediatePropagation()},true);
if(innerWidth<900)document.body.classList.add('noadm');
msg('Welcome to Screen Stocks. Buy low, sell high.');
build();fit();loop();if(!S.tutDone)tut(0);setInterval(step,500);setInterval(second,1000);addEventListener('beforeunload',save);
</script></body></html>

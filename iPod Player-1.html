<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPod Player</title>
<style>
:root{--bg:#cfd3d7;--ink:#1d1f22;--mut:#5d636b;--tray:#f4f5f6;--line:#b5bac0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d20;--ink:#eceef0;--mut:#9aa1a9;--tray:#2a2d31;--line:#41454b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1d20;--ink:#eceef0;--mut:#9aa1a9;--tray:#2a2d31;--line:#41454b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 12px}
.ipod{width:330px;max-width:100%;padding:20px 20px 30px;border-radius:36px;background:linear-gradient(155deg,#fdfdfb,#d8d9d5);box-shadow:0 1px 0 #fff inset,0 0 0 1px #b9bab6,0 24px 50px rgba(0,0,0,.35);user-select:none;-webkit-user-select:none}
.scr{position:relative;height:222px;border-radius:7px;background:#f5f7f9;border:2px solid #8e9196;box-shadow:0 0 0 3px #1c1d1f inset;overflow:hidden;color:#111}
.hd{height:24px;display:flex;align-items:center;justify-content:space-between;padding:0 9px;font-size:13px;font-weight:700;background:linear-gradient(#f3f4f6,#c6c9ce);border-bottom:1px solid #9a9ea4}
.bat{width:20px;height:9px;border:1px solid #444;border-radius:2px;background:linear-gradient(90deg,#4a4 80%,transparent 80%)}
.list{height:194px;overflow-y:auto;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.row{height:26px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;font-size:15px;white-space:nowrap;overflow:hidden}
.row span{overflow:hidden;text-overflow:ellipsis}
.row.on{color:#fff;background:linear-gradient(#5db2f6,#1a6dcf)}
.empty{padding:30px 18px;font-size:14px;line-height:1.4;color:#444;text-align:center}
.np{padding:8px 12px;text-align:center}
.art{width:184px;height:104px;margin:0 auto 8px;border-radius:4px;background:linear-gradient(135deg,#dfe4ea,#aab3bd);display:flex;align-items:center;justify-content:center;font-size:44px;color:#fff}
#ytw{position:absolute;left:50%;top:32px;width:184px;height:104px;margin-left:-92px;border:0;background:#000;border-radius:4px;visibility:hidden}
.ti{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:#555;margin-bottom:6px}
.pb{height:9px;border:1px solid #888;border-radius:5px;background:#e3e6ea;overflow:hidden;cursor:pointer}
.pb i,.vl i{display:block;height:100%;width:0;background:linear-gradient(#6bb8f7,#1a6dcf)}
.tm{display:flex;justify-content:space-between;font-size:11px;color:#444;margin:2px 0 5px}
.vl{height:5px;width:90px;margin:0 auto;border-radius:3px;background:#d3d7dc;overflow:hidden}
.vl i{background:#777}
.wheel{position:relative;width:236px;height:236px;margin:28px auto 0;border-radius:50%;background:radial-gradient(circle at 50% 35%,#f1f1ef,#d3d4d1);box-shadow:0 0 0 1px #b4b5b2,0 2px 4px rgba(0,0,0,.2) inset;touch-action:none}
.lb{position:absolute;border:0;background:none;font:700 13px "Helvetica Neue",Arial,sans-serif;color:#8b8d90;padding:8px;cursor:pointer;letter-spacing:.5px}
.lb:hover{color:#444}
.lb.m{top:10px;left:50%;transform:translateX(-50%)}
.lb.p{bottom:10px;left:50%;transform:translateX(-50%)}
.lb.v{left:10px;top:50%;transform:translateY(-50%)}
.lb.n{right:10px;top:50%;transform:translateY(-50%)}
.c{position:absolute;left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;border-radius:50%;border:1px solid #b9bab7;background:radial-gradient(circle at 50% 30%,#fff,#e6e6e3);box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #1a6dcf;outline-offset:2px}
.tray{width:330px;max-width:100%;background:var(--tray);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tray button{font:600 14px inherit;font-family:inherit;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.tray button:hover{border-color:#1a6dcf}
.yr{display:flex;gap:8px}
.yr input{flex:1;min-width:0;font:14px inherit;font-family:inherit;padding:10px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink)}
#msg{margin:0;font-size:13px;color:var(--mut);min-height:18px}
.drop #ip{outline:3px dashed #1a6dcf;outline-offset:6px}
body{background:radial-gradient(ellipse at 50% 15%,rgba(255,255,255,.22),transparent 60%),var(--bg)}
.ipod{position:relative;width:336px;padding:22px 21px 36px;border-radius:26px;background:linear-gradient(180deg,#fff 0%,#f5f5f3 45%,#e4e4e1 100%);box-shadow:inset 0 2px 1px #fff,inset 0 -4px 6px rgba(0,0,0,.12),inset 0 0 0 1px rgba(255,255,255,.9),0 0 0 1px #a7a8a5,0 2px 2px rgba(0,0,0,.25),0 18px 36px rgba(0,0,0,.4),0 46px 60px -22px rgba(0,0,0,.4)}
.ipod::after{content:"";position:absolute;left:0;right:0;top:0;height:34%;border-radius:26px 26px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none}
.scr{position:relative;height:238px;padding:8px;border:0;border-radius:11px;background:linear-gradient(#1c1c1e,#050505);box-shadow:0 0 0 1px #8b8c8a,0 1px 0 1px #fff,inset 0 1px 2px rgba(255,255,255,.25)}
.scr::after{content:"";position:absolute;left:8px;right:8px;top:8px;height:42%;border-radius:3px 3px 50% 50%/3px 3px 16px 16px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0));pointer-events:none}
#s{position:relative;height:100%;border-radius:3px;overflow:hidden;background:#f6f8fa}
#ytw{top:40px}
.hd{position:relative;background:linear-gradient(#fdfdfd 0%,#e6e8eb 50%,#cdd0d5 51%,#dfe2e6 100%);border-bottom:1px solid #8c9197}
.hd span:nth-child(1){order:2;flex:1;text-align:center}
.hd span:nth-child(2){order:1;width:16px;font-size:10px;color:#2a6fd0}
.bat{order:3;position:relative;width:22px;height:10px;border:1px solid #555;border-radius:2px;background:linear-gradient(90deg,#5ccf5c,#2fa42f 85%,#e4e4e4 85%)}
.bat::after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:4px;background:#555;border-radius:0 1px 1px 0}
.list{height:198px}
.list.half{width:54%;border-right:1px solid #b9bec5}
.pane{position:absolute;right:0;top:24px;bottom:0;width:46%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:linear-gradient(160deg,#f0f5fa,#bccfe3);color:#46698f}
.pane b{font-size:58px;font-weight:400;line-height:1}
.pane small{font-size:12px}
.wheel{width:240px;height:240px;margin:32px auto 0;background:radial-gradient(circle at 50% 26%,#fff 0%,#f2f2f0 55%,#e0e0dd 100%);box-shadow:0 0 0 1px #b8b9b6,0 1px 0 1px rgba(255,255,255,.95),0 3px 6px rgba(0,0,0,.2),inset 0 0 0 1px rgba(255,255,255,.85),inset 0 -8px 14px rgba(0,0,0,.07)}
.lb{color:#9b9da0;text-shadow:0 1px 0 #fff;font-size:14px}
.lb:hover{color:#6c6f72}
.lb svg{display:block}
.lb.m{top:14px}.lb.p{bottom:16px}.lb.v{left:12px}.lb.n{right:12px}
.c{width:96px;height:96px;margin:-48px 0 0 -48px;border:0;background:radial-gradient(circle at 50% 24%,#fff,#f1f1ef 70%,#e3e3e0);box-shadow:0 0 0 1px #b4b5b2,0 0 0 4px rgba(0,0,0,.05),0 2px 4px rgba(0,0,0,.28),inset 0 -4px 7px rgba(0,0,0,.08),inset 0 1px 0 #fff}
.c:active{transform:scale(.98)}
body{background:var(--bg)}
.tray{width:336px;background:none;border:0;padding:0;gap:12px}
.tray button,.yr input{font-size:16px;padding:14px}
#msg{font-size:15px}
.art,.pane{background-size:cover;background-position:center}
.art.sq{width:104px}
.pane[style] small{color:#fff;text-shadow:0 1px 3px #000}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div class="ipod" id="ip">
  <div class="scr"><div id="s"></div><iframe id="ytw" src="about:blank" allow="autoplay; encrypted-media" title="YouTube player"></iframe></div>
  <div class="wheel" id="wh">
    <button class="lb m" data-k="menu" style="font-size:15px">MENU</button>
    <button class="lb v" data-k="prev" aria-label="Previous"><svg width="24" height="14" viewBox="0 0 24 14" fill="currentColor"><rect x="0.5" width="2.4" height="14"/><path d="M13 0v14L4 7zM23 0v14L14 7z"/></svg></button>
    <button class="lb n" data-k="next" aria-label="Next"><svg width="24" height="14" viewBox="0 0 24 14" fill="currentColor"><path d="M1 0v14l9-7zM11 0v14l9-7z"/><rect x="20.6" width="2.4" height="14"/></svg></button>
    <button class="lb p" data-k="pp" aria-label="Play or pause"><svg width="26" height="14" viewBox="0 0 26 14" fill="currentColor"><path d="M0 0v14l10-7z"/><rect x="14" width="4" height="14"/><rect x="21" width="4" height="14"/></svg></button>
    <button class="c" data-k="ok" aria-label="Select"></button>
  </div>
</div>
<div class="tray">
  <button id="addf">Add MP3s or a ZIP</button>
  <button id="addc">Set album covers</button>
  <div class="yr"><input id="yu" type="url" placeholder="Paste a YouTube link" aria-label="YouTube link"><button id="addy">Add</button></div>
  <p id="msg">Add MP3s, or a ZIP with an MP3 and a cover image and the art is added automatically.</p>
  <input id="fi" type="file" accept="audio/*,.mp3,.zip,application/zip,image/*" multiple hidden>
  <input id="ci" type="file" accept="image/*" hidden>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>{s=Math.max(0,s|0);return (s/60|0)+":"+String(s%60).padStart(2,"0")};
const audio=new Audio(),yt=$("#ytw"),menu=["Music","Now Playing","Add Music","Album Covers"];
let pend=-1,tracks=[],cur=-1,screen="menu",sel=0,vol=.7,playing=false,pos=0,dur=0,ytReady=false,suppress=false;
const isYT=()=>cur>=0&&tracks[cur].type==="yt";
const msg=t=>{$("#msg").textContent=t};
const cv=()=>tracks.map((t,i)=>i).filter(i=>tracks[i].type==="file");
const curCover=()=>cur>=0&&tracks[cur].cover||"";

function render(){
  const s=$("#s");let body;
  const hd=t=>`<div class="hd"><span>${t}</span><span>${playing?"&#9654;":""}</span><span class="bat"></span></div>`;
  if(screen==="player"){
    const t=tracks[cur];
    body=hd("Now Playing")+`<div class="np"><div class="art${t.type==="yt"?"":" sq"}"${t.cover?` style="background-image:url(${t.cover})"`:""}>${t.type==="yt"||t.cover?"":"&#9835;"}</div><div class="ti">${esc(t.title)}</div><div class="sub">${cur+1} of ${tracks.length}</div><div class="pb" id="pb"><i id="bar"></i></div><div class="tm"><span id="cur">0:00</span><span id="dur">--:--</span></div><div class="vl"><i id="vl"></i></div></div>`;
  }else{
    const items=screen==="menu"?menu:screen==="covers"?cv().map(i=>tracks[i].title):tracks.map(t=>t.title);
    body=hd(screen==="menu"?"iPod":screen==="covers"?"Album Covers":"Music")+(items.length?`<div class="list${screen==="menu"?" half":""}" id="ls">${items.map((x,i)=>`<div class="row${i===sel?" on":""}"><span>${esc(x)}</span>${screen==="menu"?"<span>&rsaquo;</span>":screen==="covers"&&tracks[cv()[i]].cover?"<span>&#10003;</span>":""}</div>`).join("")}</div>${screen==="menu"?`<div class="pane"${curCover()?` style="background-image:url(${curCover()})"`:""}><b>${curCover()?"":"&#9835;"}</b><small>${tracks.length} song${tracks.length===1?"":"s"}</small></div>`:""}`:`<div class="empty">No songs yet.<br>Add MP3 files or paste a YouTube link below the iPod.</div>`);
  }
  s.innerHTML=body;
  const on=s.querySelector(".row.on");if(on)on.scrollIntoView({block:"nearest"});
  const pb=$("#pb");if(pb)pb.onclick=e=>{const r=pb.getBoundingClientRect();seek((e.clientX-r.left)/r.width)};
  yt.style.visibility=(screen==="player"&&isYT())?"visible":"hidden";
  tick();
}
function tick(){
  const b=$("#bar");if(!b)return;
  b.style.width=(dur?Math.min(100,pos/dur*100):0)+"%";
  $("#cur").textContent=fmt(pos);$("#dur").textContent=dur?fmt(dur):"--:--";
  $("#vl").style.width=vol*100+"%";
}
function go(sc){screen=sc;sel=(sc==="library"&&cur>=0)?cur:0;if(sc==="library")screen="library";render()}

function cmd(f,a){try{yt.contentWindow.postMessage(JSON.stringify({event:"command",func:f,args:a||[]}),"*")}catch(e){}}
function stopAll(){audio.pause();if(yt.src!=="about:blank")yt.src="about:blank"}
function play(i){
  if(i<0||i>=tracks.length)return;
  stopAll();cur=i;pos=0;dur=0;ytReady=false;const t=tracks[i];playing=true;
  if(t.type==="file"){audio.src=t.url;audio.volume=vol;audio.play().catch(()=>{playing=false;render()})}
  else yt.src="https://www.youtube-nocookie.com/embed/"+t.id+"?enablejsapi=1&autoplay=1&playsinline=1&rel=0&controls=0";
  screen="player";render();
}
function toggle(){
  if(cur<0)return msg("Pick a song from Music first.");
  if(isYT()){cmd(playing?"pauseVideo":"playVideo");playing=!playing;render()}
  else audio.paused?audio.play():audio.pause();
}
function next(){if(tracks.length)play((cur+1)%tracks.length)}
function prev(){if(!tracks.length)return;if(pos>3)seek(0);else play((cur-1+tracks.length)%tracks.length)}
function seek(f){
  f=Math.max(0,Math.min(1,f));
  if(isYT()){if(dur){cmd("seekTo",[f*dur,true]);pos=f*dur}}
  else if(audio.duration)audio.currentTime=f*audio.duration;
  tick();
}
function setVol(v){vol=Math.max(0,Math.min(1,v));audio.volume=vol;if(isYT())cmd("setVolume",[Math.round(vol*100)]);tick()}
audio.addEventListener("play",()=>{playing=true;render()});
audio.addEventListener("pause",()=>{playing=false;render()});
audio.addEventListener("timeupdate",()=>{pos=audio.currentTime;dur=audio.duration||0;tick()});
audio.addEventListener("ended",next);

yt.addEventListener("load",()=>{if(yt.src!=="about:blank")listen()});
const listen=()=>{try{yt.contentWindow.postMessage(JSON.stringify({event:"listening",id:1,channel:"widget"}),"*")}catch(e){}};
setInterval(()=>{if(isYT()&&!ytReady)listen()},800);
addEventListener("message",e=>{
  if(e.source!==yt.contentWindow||!isYT())return;
  let d;try{d=JSON.parse(e.data)}catch(x){return}
  const i=d&&d.info;if(!i)return;
  if(!ytReady){ytReady=true;cmd("setVolume",[Math.round(vol*100)])}
  if(i.currentTime!=null)pos=i.currentTime;
  if(i.duration)dur=i.duration;
  const t=tracks[cur];
  if(i.videoData&&i.videoData.title&&t.title!==i.videoData.title){t.title=i.videoData.title;render()}
  if(i.playerState!=null){
    const p=i.playerState===1||i.playerState===3;
    if(i.playerState===0)return next();
    if(p!==playing){playing=p;render()}
  }
  tick();
});

function scroll(d){
  if(screen==="player")return setVol(vol+d*.05);
  const n=screen==="menu"?menu.length:screen==="covers"?cv().length:tracks.length;if(!n)return;
  const v=Math.max(0,Math.min(n-1,sel+d));if(v!==sel){sel=v;render()}
}
function press(k){
  if(k==="menu"){if(screen==="player")go("library");else if(screen==="library"||screen==="covers")go("menu")}
  else if(k==="prev")prev();else if(k==="next")next();else if(k==="pp")toggle();
  else if(k==="ok"){
    if(screen==="menu"){
      if(sel===0)go("library");
      else if(sel===1){cur>=0?(screen="player",render()):msg("Nothing is playing yet.")}
      else if(sel===2)$("#fi").click();else go("covers");
    }else if(screen==="covers"){const i=cv()[sel];if(i!=null){pend=i;$("#ci").click()}}else if(screen==="library"){if(tracks.length)play(sel)}
    else toggle();
  }
}
document.querySelectorAll("#wh button").forEach(b=>b.addEventListener("click",()=>{if(!suppress)press(b.dataset.k)}));

let drag=null;
const ang=e=>Math.atan2(e.clientY-drag.cy,e.clientX-drag.cx)*180/Math.PI;
$("#wh").addEventListener("pointerdown",e=>{
  if(e.target.closest(".c"))return;
  const r=$("#wh").getBoundingClientRect();
  drag={cx:r.left+r.width/2,cy:r.top+r.height/2,a:0,acc:0,moved:0};drag.a=ang(e);
});
addEventListener("pointermove",e=>{
  if(!drag)return;
  const a=ang(e);let d=a-drag.a;if(d>180)d-=360;if(d<-180)d+=360;
  drag.a=a;drag.acc+=d;drag.moved+=Math.abs(d);
  while(Math.abs(drag.acc)>=26){const s=Math.sign(drag.acc);scroll(s);drag.acc-=s*26}
});
addEventListener("pointerup",()=>{if(drag&&drag.moved>6){suppress=true;setTimeout(()=>suppress=false,0)}drag=null});
$("#ip").addEventListener("wheel",e=>{e.preventDefault();scroll(e.deltaY>0?1:-1)},{passive:false});
addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  const m={ArrowDown:()=>scroll(1),ArrowUp:()=>scroll(-1),ArrowRight:()=>press("next"),ArrowLeft:()=>press("prev"),Enter:()=>press("ok"),Escape:()=>press("menu")," ":()=>press("pp")};
  if(m[e.key]){e.preventDefault();m[e.key]()}
});

const AUD=/\.(mp3|m4a|wav|ogg|flac|aac|opus)$/i,IMG=/\.(png|jpe?g|webp|gif)$/i;
const MIME={mp3:"audio/mpeg",m4a:"audio/mp4",wav:"audio/wav",ogg:"audio/ogg",opus:"audio/ogg",flac:"audio/flac",aac:"audio/aac",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",webp:"image/webp",gif:"image/gif"};
const ext=p=>p.split(".").pop().toLowerCase(),base=p=>p.split("/").pop().replace(/\.[^.]+$/,""),dir=p=>p.includes("/")?p.slice(0,p.lastIndexOf("/")):"";
async function addFiles(files){
  files=Array.from(files);msg("Reading files…");
  const it=[];
  for(const f of files){
    if(/\.zip$/i.test(f.name)){
      if(typeof JSZip==="undefined"){msg("The ZIP reader didn’t load. Add MP3 files directly instead.");continue}
      try{const z=await JSZip.loadAsync(f);
        z.forEach((p,e)=>{if(!e.dir&&!/(^|\/)(__MACOSX|\.[^/]*)/.test(p))it.push({p,g:f.name,get:()=>e.async("blob")})});
      }catch(x){msg("Couldn’t open "+f.name+".")}
    }else it.push({p:f.name,g:"",get:async()=>f});
  }
  const au=it.filter(x=>AUD.test(x.p)).sort((a,b)=>a.g.localeCompare(b.g)||a.p.localeCompare(b.p,undefined,{numeric:true}));
  const im=it.filter(x=>IMG.test(x.p));
  if(!au.length){msg(im.length?"Found an image but no song. Use Set album covers to add one to a song.":"No audio found. Try MP3 files or a ZIP with MP3s.");return}
  const cache=new Map();
  const urlOf=async x=>{if(!cache.has(x)){const b=await x.get();cache.set(x,URL.createObjectURL(new Blob([b],{type:MIME[ext(x.p)]||""})))}return cache.get(x)};
  let n=0,c=0;
  for(const a of au){
    const gi=im.filter(i=>i.g===a.g),same=gi.filter(i=>dir(i.p)===dir(a.p));
    const named=same.find(i=>/^(cover|folder|front|album|artwork)/i.test(base(i.p)));
    const m=gi.find(i=>base(i.p).toLowerCase()===base(a.p).toLowerCase())||(same.length===1?same[0]:null)||named||(gi.length===1?gi[0]:null);
    tracks.push({type:"file",title:base(a.p),url:await urlOf(a),cover:m?await urlOf(m):""});
    n++;if(m)c++;
  }
  msg(`Added ${n} song${n>1?"s":""}${c?`, ${c} with album art`:""}. Open Music to play.`);
  go("library");sel=tracks.length-n;render();
}
$("#ci").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f||pend<0)return;tracks[pend].cover=URL.createObjectURL(f);msg("Album cover added to “"+tracks[pend].title+"”.");pend=-1;render()};
function addYT(){
  const m=$("#yu").value.match(/(?:youtu\.be\/|v=|embed\/|shorts\/|live\/)([\w-]{11})/);
  if(!m)return msg("That doesn’t look like a YouTube link.");
  tracks.push({type:"yt",id:m[1],title:"YouTube video "+m[1]});
  $("#yu").value="";msg("Added the video. Open Music to play it.");
  go("library");sel=tracks.length-1;render();
}
$("#addf").onclick=()=>$("#fi").click();
$("#fi").onchange=e=>{addFiles(e.target.files);e.target.value=""};
$("#addy").onclick=addYT;
$("#addc").onclick=()=>go("covers");
